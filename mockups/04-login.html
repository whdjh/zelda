<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>목업 04 — 자유 아이디 간편 로그인</title>
  <style>
    :root {
      --bg-page: #f7f5ee;
      --bg-surface: #ffffff;
      --bg-muted: #f5f3ec;
      --fg-neutral: #1a1c20;
      --fg-muted: #555d6d;
      --fg-subtle: #868b94;
      --stroke: #e8e4d9;
      --stroke-strong: #d8d2c3;
      --brand: #16794f;
      --brand-pressed: #0d5436;
      --brand-weak: #ebf6f0;
      --gold: #9e700d;
      --gold-weak: #fdf6e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg-page);
      color: var(--fg-neutral);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 12px;
      word-break: keep-all;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      height: min(812px, calc(100dvh - 24px));
      background: var(--bg-surface);
      border: 1px solid var(--stroke-strong);
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back {
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 10px;
      background: var(--bg-muted);
    }
    .pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-pressed);
      background: var(--brand-weak);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }
    .intro {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .intro img {
      width: 56px;
      height: 56px;
      border-radius: 16px;
    }
    h1 { font-size: 22px; line-height: 1.3; letter-spacing: -0.02em; }
    p.sub { font-size: 14px; color: var(--fg-muted); line-height: 1.5; }
    .panel {
      background: var(--bg-muted);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--fg-neutral);
    }
    input {
      min-height: 46px;
      padding: 0 13px;
      border-radius: 12px;
      border: 1px solid var(--stroke-strong);
      background: #ffffff;
      color: var(--fg-neutral);
      font-size: 15px;
    }
    input:focus {
      outline: 2px solid var(--brand);
      outline-offset: 1px;
    }
    .helper { font-size: 12px; color: var(--fg-subtle); line-height: 1.45; }
    .btn {
      min-height: 48px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: 0;
      display: grid;
      place-items: center;
      text-decoration: none;
    }
    .brand { background: var(--brand); color: #ffffff; }
    .weak { background: #ffffff; color: var(--fg-neutral); border: 1px solid var(--stroke-strong); }
    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid var(--stroke);
    }
    .profile img { width: 44px; height: 44px; border-radius: 12px; }
    .id-text { font-size: 16px; font-weight: 700; }
    .sync-text { font-size: 12px; color: var(--brand-pressed); font-weight: 600; margin-top: 2px; }
    .hidden { display: none !important; }
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--fg-subtle);
      line-height: 1.4;
    }
    @media (max-width: 420px) {
      body { padding: 0; background: var(--bg-surface); }
      .phone { max-width: none; height: 100dvh; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <a class="back" href="./index.html">‹ 목록</a>
    </header>

    <section class="content" id="loggedOutView">
      <div class="intro">
        <img src="../public/assets/zelda/adventure-emblem.png" alt="" />
        <h1>시간의 오카리나</h1>
      </div>

      <form class="panel" id="loginForm">
        <label>
          모험 아이디
          <input id="idInput" type="text" placeholder="hyrule-link" maxlength="24" required />
        </label>
        <p class="helper">개인정보 없이 편한 아이디만 적어 주세요.</p>
        <button class="btn brand" type="submit">시작하기</button>
      </form>
    </section>

    <section class="content hidden" id="loggedInView">
      <div class="panel">
        <div class="profile">
          <img src="../public/assets/zelda/adventure-emblem.png" alt="" />
          <div>
            <div class="id-text" id="savedIdText">hyrule-link</div>
          </div>
        </div>
        <a class="btn brand" href="./01-card-choice.html">증강 카드 보기</a>
        <button class="btn weak" type="button" id="logoutBtn">아이디 변경</button>
      </div>
    </section>

    <footer></footer>
  </div>

  <script>
    const KEY = "zelda-highpass-mock-id";
    const outView = document.getElementById("loggedOutView");
    const inView = document.getElementById("loggedInView");
    const idInput = document.getElementById("idInput");
    const savedIdText = document.getElementById("savedIdText");

    function render() {
      const saved = localStorage.getItem(KEY);
      outView.classList.toggle("hidden", Boolean(saved));
      inView.classList.toggle("hidden", !saved);
      if (saved) savedIdText.textContent = saved;
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const value = idInput.value.trim();
      if (!value) return;
      localStorage.setItem(KEY, value);
      render();
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem(KEY);
      idInput.value = "";
      render();
    });

    render();
  </script>
</body>
</html>
