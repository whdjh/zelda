<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>목업 02 — 선택한 갈래 진행 화면</title>
  <style>
    :root {
      --bg-page: #f7f5ee;
      --bg-surface: #ffffff;
      --bg-muted: #f5f3ec;
      --fg-neutral: #1a1c20;
      --fg-muted: #555d6d;
      --fg-subtle: #868b94;
      --stroke: #e8e4d9;
      --stroke-strong: #d8d2c3;
      --brand: #16794f;
      --brand-pressed: #0d5436;
      --brand-weak: #ebf6f0;
      --brand-stroke: #b3dec9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg-page);
      color: var(--fg-neutral);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 12px;
      word-break: keep-all;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      height: min(812px, calc(100dvh - 24px));
      background: var(--bg-surface);
      border: 1px solid var(--stroke-strong);
      border-radius: 28px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .back {
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 10px;
      border-radius: 10px;
      background: var(--bg-muted);
    }
    .state {
      font-size: 12px;
      font-weight: 700;
      color: var(--brand-pressed);
    }
    .hero {
      margin-top: 12px;
      padding: 16px;
      border-radius: 18px;
      background: var(--brand-weak);
      border: 1px solid var(--brand-stroke);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .hero img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      flex-shrink: 0;
    }
    .pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-pressed);
      background: #ffffff;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 4px;
    }
    .hero h1 { font-size: 17px; line-height: 1.3; margin-bottom: 3px; }
    .hero p { font-size: 13px; color: var(--fg-muted); line-height: 1.4; }
    .steps {
      margin-top: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .steps h2 { font-size: 13px; font-weight: 700; color: var(--fg-muted); }
    label.step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      border-radius: 14px;
      background: var(--bg-muted);
      border: 1px solid var(--stroke);
      font-size: 14px;
      line-height: 1.45;
      cursor: pointer;
    }
    label.step input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--brand);
      flex-shrink: 0;
    }
    label.step.done span {
      text-decoration: line-through;
      color: var(--fg-subtle);
    }
    .ref {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--stroke-strong);
      background: var(--bg-surface);
      color: var(--fg-muted);
      text-decoration: none;
      font-size: 13px;
    }
    .ref strong { color: var(--fg-neutral); }
    footer {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
    }
    .btn {
      min-height: 48px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      display: grid;
      place-items: center;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-weak { background: var(--bg-muted); color: var(--fg-neutral); border: 1px solid var(--stroke-strong); }
    .btn-brand { background: var(--brand); color: #ffffff; border: 0; }
    @media (max-width: 420px) {
      body { padding: 0; background: var(--bg-surface); }
      .phone { max-width: none; height: 100dvh; border: 0; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <a class="back" href="./01-card-choice.html">‹ 갈래 다시 고르기</a>
      <span class="state">진행 중</span>
    </header>

    <section class="hero">
      <img src="../public/assets/zelda/sword-shield.png" alt="" />
      <div>
        <span class="pill">선택한 카드</span>
        <h1>기본 장비 챙기고 첫 던전 직행</h1>
        <p>핵심만 3줄로 보고, 필요할 때만 단일 참고 링크를 엽니다.</p>
      </div>
    </section>

    <section class="steps" aria-label="지금 할 일">
      <h2>지금 할 일 (체크 선택)</h2>
      <label class="step">
        <input type="checkbox" />
        <span>마을 남서쪽 훈련장에서 검을 찾는다.</span>
      </label>
      <label class="step">
        <input type="checkbox" />
        <span>40루피를 모아 상점에서 방패를 산다.</span>
      </label>
      <label class="step">
        <input type="checkbox" />
        <span>장비를 착용하고 동쪽 입구로 이동한다.</span>
      </label>

      <a class="ref" href="#ref" onclick="alert('참고 사이트는 GameWith 한 곳으로 통일해 새 탭으로 엽니다.'); return false;">
        <span>참고 공략 (단일 사이트 통일)</span>
        <strong>GameWith ↗</strong>
      </a>
    </section>

    <footer>
      <a class="btn btn-weak" href="./03-puzzle-hint.html">막혔어요 (힌트)</a>
      <a class="btn btn-brand" href="./01-card-choice.html">완료 · 다음 카드</a>
    </footer>
  </div>

  <script>
    document.querySelectorAll("label.step input").forEach((input) => {
      input.addEventListener("change", () => {
        input.closest("label.step").classList.toggle("done", input.checked);
      });
    });
  </script>
</body>
</html>
